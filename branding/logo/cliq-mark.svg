<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Cliq mark</title>
  <desc id="desc">A connected violet capture loop on a black rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B102E"/>
      <stop offset="1" stop-color="#09070D"/>
    </linearGradient>
    <linearGradient id="signal" x1="18" y1="46" x2="47" y2="17" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#C4A5FF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#surface)" stroke="#2E1D49" stroke-width="2"/>
  <path d="M44 19.5A17 17 0 1 0 44 44.5" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="44" cy="19.5" r="4.25" fill="#EFE7FF"/>
