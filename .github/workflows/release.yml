name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsix-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            visualstudio/**/packages.lock.json

      - name: Restore and validate the backend payload
        working-directory: backend
        run: |
          dotnet restore Cliq.slnx --locked-mode
          dotnet build Cliq.slnx --configuration Release --no-restore
          dotnet test Cliq.slnx --configuration Release --no-build

      - name: Resolve release version from the tag
        id: version
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Tag '$tag' is not a valid three-part release version."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Build and validate the release VSIX
        shell: powershell
        run: .\visualstudio\build\Build-Vsix.ps1 -Target Build -Configuration Release -Version "${{ steps.version.outputs.version }}"

      - name: Smoke-test the packaged runtime
        shell: powershell
        run: .\visualstudio\build\Test-PackagedRuntime.ps1 -Browser chrome

      - name: Stage release assets
        id: stage
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $vsix = Get-ChildItem -LiteralPath .\visualstudio\Cliq.VisualStudio\bin\Release -Recurse -File -Filter '*.vsix' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $vsix) {
            throw 'The extension build did not produce a VSIX.'
          }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $target = Join-Path $releaseDirectory "Cliq.VisualStudio-$version.vsix"
          Copy-Item -LiteralPath $vsix.FullName -Destination $target
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $target)" |
            Set-Content -LiteralPath "$target.sha256" -Encoding ascii
          "vsix=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "sha256=$target.sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="visualstudio/Cliq.VisualStudio/RELEASE-NOTES.txt"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes "$(cat "$NOTES_FILE")")
          fi
          gh release create "$TAG" \
            "${{ steps.stage.outputs.vsix }}" \
            "${{ steps.stage.outputs.sha256 }}" \
            --title "Cliq for Visual Studio $VERSION" \
            "${NOTES_ARGS[@]}"
