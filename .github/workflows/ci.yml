name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore Cliq.slnx --locked-mode
      - run: dotnet build Cliq.slnx --configuration Release --no-restore
      - run: dotnet test Cliq.slnx --configuration Release --no-build
      - run: dotnet format Cliq.slnx --verify-no-changes --no-restore

  visual-studio-extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            visualstudio/**/packages.lock.json
      - name: Build and validate preview VSIX
        shell: powershell
        run: .\visualstudio\build\Build-Vsix.ps1 -Target Build -Configuration Release
      - name: Upload preview VSIX
        uses: actions/upload-artifact@v6
        with:
          name: Cliq-VisualStudio-preview
          path: visualstudio/Cliq.VisualStudio/bin/Release/**/*.vsix
          if-no-files-found: error
